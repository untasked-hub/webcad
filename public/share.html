<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebCAD — shared drawing</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0b1017; color: #d9dee7;
    font: 14px/1.45 Inter, system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: #0f1620;
    border-bottom: 1px solid #1c2735; flex: none;
  }
  header .logo { font-weight: 700; letter-spacing: .4px; color: #7fd1ff; text-decoration: none; }
  header .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    flex: none; font-size: 11px; font-weight: 700; letter-spacing: .6px;
    color: #ffb454; border: 1px solid #ffb454; border-radius: 4px;
    padding: 2px 8px; text-transform: uppercase;
  }
  header .when { margin-left: auto; color: #77869b; font-size: 12px; white-space: nowrap; }
  #duplicate, #measure { flex: none; cursor: pointer; border: 1px solid #32617a; border-radius: 5px; background: #143348; color: #9cddff; padding: 6px 10px; font: 600 12px inherit; }
  #duplicate:hover, #measure:hover { background: #1b4560; }
  #duplicate:disabled { opacity: .65; cursor: wait; }
  #measure.on { background: #1d5a3a; border-color: #2f8f5b; color: #8ff0b3; }
  #measureReadout { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; color: #8ff0b3; min-width: 0; white-space: nowrap; }
  #measureSummary { display: none; position: absolute; z-index: 2; top: 12px; right: 12px; width: min(280px, calc(100% - 24px)); max-height: min(42vh, 260px); overflow: auto; padding: 11px 12px; border: 1px solid #285543; border-radius: 8px; background: rgba(12, 24, 22, .94); box-shadow: 0 8px 24px rgba(0,0,0,.28); color: #c8f4df; pointer-events: none; }
  #measureSummary.on { display: block; }
  #measureSummary h2 { margin: 0 0 7px; color: #8ff0b3; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  #measureSummary p { color: #89a99b; font-size: 11px; margin-bottom: 7px; }
  #measureSummary ol { padding-left: 21px; font: 11px/1.65 "JetBrains Mono", ui-monospace, monospace; }
  #measureSummary li { padding-left: 2px; }
  main { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .msg {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; text-align: center;
    color: #77869b; padding: 24px;
  }
  .msg .big { font-size: 40px; }
  .msg h1 { font-size: 17px; color: #d9dee7; font-weight: 600; }
  .msg a { color: #7fd1ff; }
  footer {
    flex: none; padding: 7px 16px; border-top: 1px solid #1c2735;
    color: #77869b; font-size: 12px; display: flex; gap: 8px; align-items: center;
  }
  footer a { color: #7fd1ff; text-decoration: none; font-weight: 600; }
  .count { margin-left: auto; font-family: "JetBrains Mono", ui-monospace, monospace; }
  .note {
    display: none; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 2px 9px; border-radius: 999px; border: 1px solid #2a4a63; color: #9fd8ff;
    background: #14212e; font-size: 12px;
  }
  .note.on { display: inline-block; }
</style>
</head>
<body>
<header>
  <a class="logo" href="/">WebCAD</a>
  <span class="badge">Read-only</span>
  <span class="name" id="name">Loading…</span>
  <span class="when" id="when"></span>
  <span class="note" id="note" title=""></span>
  <button id="measure" type="button" title="Measure distances and areas on this read-only view (M)">📏 Measure</button>
  <span id="measureReadout" aria-live="polite"></span>
  <button id="duplicate" type="button" title="Create a new drawing in your account">Duplicate as editable</button>
</header>
<main id="stage">
  <canvas id="cv"></canvas>
  <aside id="measureSummary" aria-live="polite" aria-label="Temporary measurement summary"></aside>
  <div class="msg" id="msg"><div class="big">⌛</div><h1>Loading shared drawing…</h1></div>
</main>
<footer>
  <span>This is a read-only view. Open <a href="/">WebCAD</a> to draw your own. Press M to measure; Esc clears.</span>
  <span class="count" id="count"></span>
</footer>
<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const rad = (d) => d * Math.PI / 180;
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const mul = (a, k) => [a[0] * k, a[1] * k];
const len = (a) => Math.hypot(a[0], a[1]);
const norm = (a) => { const l = len(a) || 1; return [a[0] / l, a[1] / l]; };
const fmt = (v) => (Math.round(v * 100) / 100).toFixed(2).replace(/\.?0+$/, '');

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');

let view = { x: 0, y: 0, zoom: 1 };
let doc = null;
let underlayImage = null;
const measure = { on: false, pts: [], hover: null };

function cvW() { return stage.clientWidth; }
function cvH() { return stage.clientHeight; }
function w2s(p) {
  return [(p[0] - view.x) * view.zoom + cvW() / 2,
          cvH() / 2 - (p[1] - view.y) * view.zoom];
}
function s2w(p) {
  return [(p[0] - cvW() / 2) / view.zoom + view.x,
          (cvH() / 2 - p[1]) / view.zoom + view.y];
}
function unitLabel() { return doc && doc.units && doc.units !== 'none' ? ' ' + doc.units : ''; }
function unit2Label() { return doc && doc.units && doc.units !== 'none' ? ' ' + doc.units + '²' : ' sq units'; }
function polyArea(pts) {
  let a = 0;
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], q = pts[(i + 1) % pts.length];
    a += p[0] * q[1] - q[0] * p[1];
  }
  return Math.abs(a) / 2;
}
function polyLength(pts, closed) {
  let L = 0;
  for (let i = 1; i < pts.length; i++) L += dist(pts[i - 1], pts[i]);
  if (closed && pts.length > 2) L += dist(pts[pts.length - 1], pts[0]);
  return L;
}
function updateMeasureSummary() {
  const panel = document.getElementById('measureSummary');
  const pts = measure.pts;
  if (!panel) return;
  if (!measure.on || pts.length < 2) {
    panel.classList.remove('on');
    panel.replaceChildren();
    return;
  }
  const closed = pts.length >= 3;
  const list = document.createElement('ol');
  for (let i = 1; i < pts.length; i++) {
    const item = document.createElement('li');
    item.textContent = 'Segment ' + i + ' · ' + fmt(dist(pts[i - 1], pts[i])) + unitLabel();
    list.appendChild(item);
  }
  if (closed) {
    const item = document.createElement('li');
    item.textContent = 'Closing edge · ' + fmt(dist(pts[pts.length - 1], pts[0])) + unitLabel();
    list.appendChild(item);
  }
  const heading = document.createElement('h2');
  heading.textContent = 'Temporary measurement';
  const totals = document.createElement('p');
  totals.textContent = 'Path ' + fmt(polyLength(pts, closed)) + unitLabel() +
    (closed ? ' · Area ' + fmt(polyArea(pts)) + unit2Label() : '');
  panel.replaceChildren(heading, totals, list);
  panel.classList.add('on');
}

function arcPts(e, n) {
  let sweep = e.a1 - e.a0;
  while (sweep <= 0) sweep += 360;
  const out = [];
  for (let i = 0; i <= n; i++) {
    const a = rad(e.a0 + sweep * i / n);
    out.push([e.c[0] + Math.cos(a) * e.r, e.c[1] + Math.sin(a) * e.r]);
  }
  return out;
}

function dimGeom(e) {
  const d = sub(e.p2, e.p1);
  const L = len(d) || 1;
  const n = [-d[1] / L, d[0] / L];
  const o = e.offset || 0;
  const a = add(e.p1, mul(n, o));
  const b = add(e.p2, mul(n, o));
  // Shared pages are read-only, so the dimension text carries the document's
  // real-world unit: a 720 mm wall must never read as a bare "720".
  const uLabel = doc && doc.units && doc.units !== 'none' ? ' ' + doc.units : '';
  return { a, b, n, txt: e.text || (fmt(L) + uLabel),
           lines: [[e.p1, add(e.p1, mul(n, o * 1.14))],
                   [e.p2, add(e.p2, mul(n, o * 1.14))], [a, b]] };
}

function entityPoints(e) {
  switch (e.type) {
    case 'line': return [e.p1, e.p2];
    case 'polyline': return e.pts || [];
    case 'rect': return [[e.p1[0], e.p1[1]], [e.p2[0], e.p1[1]], e.p2, [e.p1[0], e.p2[1]]];
    case 'circle': {
      const out = [];
      for (let i = 0; i < 48; i++) {
        const a = TAU * i / 48;
        out.push([e.c[0] + Math.cos(a) * e.r, e.c[1] + Math.sin(a) * e.r]);
      }
      return out;
    }
    case 'arc': return arcPts(e, 36);
    case 'text': {
      const h = e.size, w = String(e.text || '').length * h * 0.62;
      return [e.p, [e.p[0] + w, e.p[1]], [e.p[0] + w, e.p[1] + h], [e.p[0], e.p[1] + h]];
    }
    case 'dim': return dimGeom(e).lines.reduce((a, s) => a.concat(s), []);
    default: return [];
  }
}

function extentsOf(ents) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const e of ents) for (const p of entityPoints(e)) {
    if (p[0] < x0) x0 = p[0];
    if (p[0] > x1) x1 = p[0];
    if (p[1] < y0) y0 = p[1];
    if (p[1] > y1) y1 = p[1];
  }
  if (!isFinite(x0)) return null;
  return { x0, y0, x1, y1 };
}

function drawUnderlay() {
  const u = doc && doc.underlay;
  if (!u || !u.visible || !u.src || !underlayImage || !underlayImage.complete || !underlayImage.naturalWidth) return;
  const tl = w2s([u.x, u.y]);
  const br = w2s([u.x + u.w, u.y - u.h]);
  const x = Math.min(tl[0], br[0]), y = Math.min(tl[1], br[1]);
  const w = Math.abs(br[0] - tl[0]), h = Math.abs(br[1] - tl[1]);
  if (w < 0.5 || h < 0.5) return;
  ctx.save();
  ctx.globalAlpha = Math.max(0.05, Math.min(1, u.opacity == null ? 0.55 : u.opacity));
  try { ctx.drawImage(underlayImage, x, y, w, h); } catch (_) {}
  ctx.restore();
}

function layerOf(name) {
  return doc.layers.find(l => l.name === name) || doc.layers[0];
}

function pathFor(e) {
  ctx.beginPath();
  switch (e.type) {
    case 'line': {
      const a = w2s(e.p1), b = w2s(e.p2);
      ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
      break;
    }
    case 'polyline': {
      const a = w2s(e.pts[0]);
      ctx.moveTo(a[0], a[1]);
      for (let i = 1; i < e.pts.length; i++) { const b = w2s(e.pts[i]); ctx.lineTo(b[0], b[1]); }
      break;
    }
    case 'rect': {
      const a = w2s(e.p1), b = w2s(e.p2);
      ctx.rect(Math.min(a[0], b[0]), Math.min(a[1], b[1]),
               Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1]));
      break;
    }
    case 'circle': {
      const c = w2s(e.c);
      ctx.arc(c[0], c[1], Math.max(0.4, e.r * view.zoom), 0, TAU);
      break;
    }
    case 'arc': {
      const c = w2s(e.c);
      let sweep = e.a1 - e.a0;
      while (sweep <= 0) sweep += 360;
      if (sweep > 360) sweep = 360;
      ctx.arc(c[0], c[1], Math.max(0.4, e.r * view.zoom), -rad(e.a0), -rad(e.a0 + sweep), true);
      break;
    }
    default: break;
  }
}

function drawEntity(e) {
  const L = layerOf(e.layer);
  if (!L || !L.visible) return;
  const col = L.color || '#d9dee7';
  ctx.save();
  ctx.lineWidth = Math.max(0.9, (L.lineweight || 1) * 1.1);
  ctx.strokeStyle = col;
  ctx.fillStyle = col;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  if (e.type === 'text') {
    const s = w2s(e.p);
    const size = Math.max(6, e.size * view.zoom);
    ctx.font = '600 ' + size + 'px Inter, system-ui, sans-serif';
    ctx.fillText(e.text, s[0], s[1] + size * 0.16);
  } else if (e.type === 'dim') {
    const g = dimGeom(e);
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (const [a, b] of g.lines) {
      const pa = w2s(a), pb = w2s(b);
      ctx.moveTo(pa[0], pa[1]); ctx.lineTo(pb[0], pb[1]);
    }
    ctx.stroke();
    const d = norm(sub(g.b, g.a));
    const ah = 7;
    for (const [pt, dir] of [[g.a, d], [g.b, mul(d, -1)]]) {
      const s = w2s(pt);
      const nx = -dir[1], ny = dir[0];
      ctx.beginPath();
      ctx.moveTo(s[0], s[1]);
      ctx.lineTo(s[0] + dir[0] * ah + nx * ah * 0.36, s[1] - dir[1] * ah + ny * ah * 0.36);
      ctx.lineTo(s[0] + dir[0] * ah - nx * ah * 0.36, s[1] - dir[1] * ah - ny * ah * 0.36);
      ctx.closePath(); ctx.fill();
    }
    const pa = w2s(g.a), pb = w2s(g.b);
    const c = [(pa[0] + pb[0]) / 2, (pa[1] + pb[1]) / 2];
    const fs = 11;
    ctx.font = '600 ' + fs + 'px "JetBrains Mono", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText(g.txt).width;
    ctx.fillStyle = '#0b1017';
    ctx.fillRect(c[0] - tw / 2 - 3, c[1] - fs / 2 - 2, tw + 6, fs + 4);
    ctx.fillStyle = col;
    ctx.fillText(g.txt, c[0], c[1]);
  } else {
    pathFor(e);
    ctx.stroke();
  }
  ctx.restore();
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(cvW() * dpr));
  cv.height = Math.max(1, Math.round(cvH() * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function fitView() {
  let ext = extentsOf(doc.entities);
  const u = doc.underlay;
  if (u && u.visible) {
    const b = { x0: u.x, y0: u.y - u.h, x1: u.x + u.w, y1: u.y };
    if (ext) {
      ext.x0 = Math.min(ext.x0, b.x0); ext.y0 = Math.min(ext.y0, b.y0);
      ext.x1 = Math.max(ext.x1, b.x1); ext.y1 = Math.max(ext.y1, b.y1);
    } else ext = b;
  }
  if (!ext) { view = { x: 0, y: 0, zoom: 1 }; return; }
  const w = ext.x1 - ext.x0, h = ext.y1 - ext.y0;
  const pad = 0.08;
  const z = Math.min(cvW() / (w * (1 + 2 * pad) || 1),
                     cvH() / (h * (1 + 2 * pad) || 1));
  view.zoom = Math.max(0.01, Math.min(80, z));
  view.x = (ext.x0 + ext.x1) / 2;
  view.y = (ext.y0 + ext.y1) / 2;
}

function drawMeasureOverlay() {
  const pts = measure.pts;
  if (!measure.on && pts.length === 0) return;
  const hover = measure.hover;
  const all = hover ? pts.concat([hover]) : pts.slice();
  ctx.save();
  ctx.lineWidth = 1.4;
  ctx.strokeStyle = '#7fffd0';
  ctx.fillStyle = '#7fffd0';
  ctx.setLineDash([6, 4]);
  if (all.length >= 2) {
    ctx.beginPath();
    const s0 = w2s(all[0]);
    ctx.moveTo(s0[0], s0[1]);
    for (let i = 1; i < all.length; i++) { const s = w2s(all[i]); ctx.lineTo(s[0], s[1]); }
    if (pts.length >= 3 && !hover) ctx.closePath();
    ctx.stroke();
  }
  ctx.setLineDash([]);
  if (pts.length >= 3) {
    ctx.beginPath();
    const s0 = w2s(pts[0]);
    ctx.moveTo(s0[0], s0[1]);
    for (let i = 1; i < pts.length; i++) { const s = w2s(pts[i]); ctx.lineTo(s[0], s[1]); }
    ctx.closePath();
    ctx.fillStyle = 'rgba(127,255,208,.12)';
    ctx.fill();
  }
  for (const p of pts) {
    const s = w2s(p);
    ctx.beginPath(); ctx.arc(s[0], s[1], 3.5, 0, TAU); ctx.fillStyle = '#7fffd0'; ctx.fill();
  }
  // labels
  ctx.font = '600 11px "JetBrains Mono", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  for (let i = 1; i < all.length; i++) {
    const a = w2s(all[i - 1]), b = w2s(all[i]);
    const seg = dist(all[i - 1], all[i]);
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    const txt = fmt(seg) + unitLabel();
    const tw = ctx.measureText(txt).width;
    ctx.fillStyle = 'rgba(11,16,23,.88)';
    ctx.fillRect(mx - tw / 2 - 3, my - 15, tw + 6, 14);
    ctx.fillStyle = '#7fffd0';
    ctx.fillText(txt, mx, my - 2);
  }
  updateMeasureSummary();
  const readout = document.getElementById('measureReadout');
  if (pts.length >= 2) {
    let txt = 'Σ ' + fmt(polyLength(pts, pts.length >= 3 && !hover)) + unitLabel();
    if (pts.length >= 3) txt += '  ·  A ' + fmt(polyArea(pts)) + unit2Label();
    readout.textContent = txt;
  } else if (measure.on) {
    readout.textContent = 'Click two or more points…';
  } else {
    readout.textContent = '';
  }
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, cvW(), cvH());
  ctx.fillStyle = '#0b1017';
  ctx.fillRect(0, 0, cvW(), cvH());
  if (!doc) return;
  drawUnderlay();
  for (const e of doc.entities) drawEntity(e);
  drawMeasureOverlay();
}

function showError(icon, title, extra) {
  document.getElementById('name').textContent = 'Unavailable';
  const msg = document.getElementById('msg');
  msg.innerHTML = '<div class="big">' + icon + '</div><h1>' + title + '</h1>' +
    (extra ? '<p>' + extra + ' <a href="/">Open WebCAD</a></p>' : '');
  msg.style.display = 'flex';
}

// token comes from /s/<token>; tolerate a trailing slash
const m = location.pathname.match(/^\/s\/([a-f0-9]{16,64})\/?$/);
if (!m) {
  showError('❓', 'This link does not point to a shared drawing', 'Check the link you were given.');
} else {
  fetch('/api/share/' + m[1])
    .then(async (res) => {
      if (res.status === 404) {
        showError('🔗', 'This share link is no longer valid',
                  'It may have been revoked by the owner.');
        return;
      }
      if (res.status === 410) {
        showError('⌛', 'This share link has expired',
                  'Ask the owner to create a new link.');
        return;
      }
      if (!res.ok) {
        showError('⚠️', 'Could not load this drawing (HTTP ' + res.status + ')',
                  'Try again later.');
        return;
      }
      const json = await res.json();
      const d = json.drawing;
      if (!d || !d.data || !Array.isArray(d.data.entities)) {
        showError('⚠️', 'This drawing has no renderable content', '');
        return;
      }
      doc = d.data;
      if (doc.underlay && doc.underlay.src) {
        underlayImage = new Image();
        underlayImage.onload = () => draw();
        underlayImage.src = doc.underlay.src;
      }
      document.getElementById('name').textContent = d.name || 'Untitled';
      document.getElementById('when').textContent =
        d.updated_at ? 'updated ' + new Date(d.updated_at).toLocaleString() : '';
      const noteEl = document.getElementById('note');
      const noteText = typeof json.share_note === 'string' ? json.share_note.trim() : '';
      if (noteText) {
        noteEl.textContent = '📌 ' + (noteText.length > 60 ? noteText.slice(0, 60) + '…' : noteText);
        noteEl.title = noteText;
        noteEl.classList.add('on');
      } else {
        noteEl.textContent = '';
        noteEl.title = '';
        noteEl.classList.remove('on');
      }
      document.getElementById('count').textContent = doc.entities.length + ' entities' +
        (doc.units && doc.units !== 'none' ? ' · ' + doc.units : '');
      document.getElementById('msg').style.display = 'none';
      resize();
      const savedView = json.share_view;
      if (savedView && Number.isFinite(savedView.x) && Number.isFinite(savedView.y) &&
          Number.isFinite(savedView.zoom) && savedView.zoom > 0) {
        view = { x: savedView.x, y: savedView.y, zoom: savedView.zoom };
      } else {
        fitView();
      }
      draw();
      window.addEventListener('resize', () => { resize(); });
      const measureBtn = document.getElementById('measure');
      const setMeasure = (on) => {
        measure.on = on;
        measure.pts = [];
        measure.hover = null;
        measureBtn.classList.toggle('on', on);
        if (!on) document.getElementById('measureReadout').textContent = '';
        updateMeasureSummary();
        draw();
      };
      measureBtn.addEventListener('click', () => setMeasure(!measure.on));
      window.addEventListener('keydown', (ev) => {
        if (ev.key === 'Escape') { setMeasure(false); }
        else if (ev.key === 'm' || ev.key === 'M') {
          const tag = (ev.target && ev.target.tagName) || '';
          if (tag !== 'INPUT' && tag !== 'TEXTAREA') setMeasure(!measure.on);
        }
      });
      cv.addEventListener('mousemove', (ev) => {
        if (!measure.on) return;
        const r = cv.getBoundingClientRect();
        measure.hover = s2w([ev.clientX - r.left, ev.clientY - r.top]);
        draw();
      });
      cv.addEventListener('mouseleave', () => {
        if (!measure.on) return;
        measure.hover = null;
        draw();
      });
      cv.addEventListener('click', (ev) => {
        if (!measure.on) return;
        const r = cv.getBoundingClientRect();
        measure.pts.push(s2w([ev.clientX - r.left, ev.clientY - r.top]));
        measure.hover = null;
        draw();
      });
      cv.addEventListener('dblclick', (ev) => {
        if (!measure.on) return;
        ev.preventDefault();
        measure.hover = null;
        draw();
      });
    })
    .catch(() => showError('⚠️', 'Network error while loading the drawing', ''));
}
document.getElementById('duplicate').addEventListener('click', async () => {
  const button = document.getElementById('duplicate');
  if (!window.confirm('Create an editable copy in your account? The original stays read-only. Your copy is saved separately.')) return;
  button.disabled = true;
  button.textContent = 'Creating copy…';
  try {
    const token = location.pathname.split('/').filter(Boolean).pop();
    const response = await fetch('/api/share/' + encodeURIComponent(token) + '/duplicate', {
      method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: '{}',
    });
    const result = await response.json().catch(() => ({}));
    if (response.status === 401) {
      button.disabled = false;
      button.textContent = 'Duplicate as editable';
      window.alert('Sign in or create an account, then return to this link to duplicate the drawing.');
      return;
    }
    if (!response.ok || !result.edit_path) throw new Error(result.error || 'Could not create the editable copy');
    window.alert(result.message);
    location.assign(result.edit_path);
  } catch (error) {
    button.disabled = false;
    button.textContent = 'Duplicate as editable';
    window.alert(error.message || 'Could not create the editable copy');
  }
});
window.addEventListener('resize', resize);
})();
</script>
